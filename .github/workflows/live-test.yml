name: Live Test

on:
  workflow_dispatch:
    inputs:
      work_item_type:
        description: Work item type to create for test data
        required: false
        default: Task

permissions:
  contents: read

jobs:
  live-test:
    name: Run live test harness
    runs-on: ubuntu-latest
    # Secrets are exposed only after this environment's protection rules pass.
    # That approval replaces the CLI's interactive confirmation, which has no
    # terminal to run in here.
    environment: live-test
    # A hung request would otherwise ride GitHub's 6-hour default with the PAT
    # live in the runner and test data sitting in the project the whole time.
    timeout-minutes: 20

    steps:
      # Every action is SHA-pinned: this job handles a PAT, and a mutable tag
      # can be repointed at new code by anyone who can push to the action repo.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 #v5.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 #v6.5.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live test harness
        env:
          AZDO_TEST_ORG_URL: ${{ vars.AZDO_TEST_ORG_URL }}
          AZDO_TEST_PROJECT: ${{ vars.AZDO_TEST_PROJECT }}
          AZDO_TEST_PAT: ${{ secrets.AZDO_TEST_PAT }}
          # Passed via env, never interpolated into the script body: a `${{ }}`
          # expression inside `run:` lets a crafted input execute as shell.
          WORK_ITEM_TYPE: ${{ inputs.work_item_type }}
        run: |
          pnpm live-test \
            --org "$AZDO_TEST_ORG_URL" \
            --project "$AZDO_TEST_PROJECT" \
            --pat "$AZDO_TEST_PAT" \
            --work-item-type "$WORK_ITEM_TYPE" \
            --yes

      - name: Sweep up any data left by an incomplete run
        # always(), not failure(): a cancelled job or a runner timeout strands
        # data just as readily as a failure, and those two cases skip failure().
        # The sweep is a no-op when no manifest is still in-progress, and the
        # harness exits 0 with "Nothing to clean up", so this is safe to always run.
        if: always()
        env:
          AZDO_TEST_PAT: ${{ secrets.AZDO_TEST_PAT }}
        run: pnpm live-test --cleanup-all --pat "$AZDO_TEST_PAT"

      - name: Upload run manifest and report
        if: always()
        # SHA-pinned to match build.yml's existing style — this workflow handles a PAT.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: live-test-run
          path: .live-test-runs/
          if-no-files-found: warn
